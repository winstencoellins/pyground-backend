name: Publish API types
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@winstencoellins"
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run types:build
      # Publishes only when types-package/package.json has a version not yet on the registry.
      - name: Publish if version is new
        working-directory: types-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published; bump types-package/package.json to publish."
          else
            npm publish
          fi
