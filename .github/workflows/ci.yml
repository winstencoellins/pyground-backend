name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: pyground
          POSTGRES_PASSWORD: pyground
          POSTGRES_DB: pyground
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pyground" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://pyground:pyground@localhost:5432/pyground
      BETTER_AUTH_SECRET: ci-only-secret-not-used-anywhere-else-0000
      WEB_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run db:generate
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run db:deploy
      - run: bun test
