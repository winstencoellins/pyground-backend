# Local development only. Railway provides Postgres in production.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pyground
      POSTGRES_PASSWORD: pyground
      POSTGRES_DB: pyground
    ports:
      - "${POSTGRES_PORT:-5434}:5432" # host port overridable; 5432/5433 are often taken by a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pyground -d pyground"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
